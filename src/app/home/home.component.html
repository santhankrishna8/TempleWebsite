<h1 class="sr-only">శ్రీ కృష్ణ భజన మందిరము, పేరూరు</h1>

<div class="banner">
  <img src="assets/image.png" width="1131" height="306" fetchpriority="high"
       alt="శ్రీ కృష్ణ భజన మందిరము — శ్రీ రుక్మిణి, సత్యభామ సమేత శ్రీ వేణుగోపాల స్వామి ఆలయము, పేరూరు">
</div>

<section class="stage" aria-roledescription="carousel" aria-label="ఆలయ చిత్రాలు">
  <div class="head">
    <div class="ctrl">
      <span class="count" aria-live="polite"><b>{{ pad(current + 1) }}</b> / {{ pad(slides.length) }}</span>
      <button type="button" class="arrow pressable" aria-label="మునుపటి" (click)="go(track, thumbs, current - 1)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <button type="button" class="arrow pressable" aria-label="తదుపరి" (click)="go(track, thumbs, current + 1)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>

  <div #track class="track" (scroll)="onScroll(track, thumbs)" tabindex="0">
    @for (s of slides; track s; let i = $index) {
      <figure class="slide" role="group" aria-roledescription="slide" [attr.aria-label]="(i + 1) + ' / ' + slides.length">
        <img class="bg" [src]="s" alt="" aria-hidden="true" [attr.loading]="i < 3 ? 'eager' : 'lazy'">
        <img class="fg" [src]="s" [alt]="'ఆలయ చిత్రం ' + (i + 1)" [attr.loading]="i < 3 ? 'eager' : 'lazy'">
      </figure>
    }
  </div>

  <div #thumbs class="thumbs">
    @for (s of slides; track s; let i = $index) {
      <button type="button" class="thumb" [class.on]="i === current" [attr.aria-label]="'చిత్రం ' + (i + 1)"
              [attr.aria-current]="i === current" (click)="go(track, thumbs, i)">
        <img [src]="s" alt="" loading="lazy">
      </button>
    }
  </div>
</section>

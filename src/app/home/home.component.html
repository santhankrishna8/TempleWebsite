<h1 class="sr-only">శ్రీ కృష్ణ భజన మందిరము, పేరూరు</h1>

<div class="banner">
  <img src="assets/image.png" width="1131" height="306" fetchpriority="high"
       alt="శ్రీ కృష్ణ భజన మందిరము — శ్రీ రుక్మిణి, సత్యభామ సమేత శ్రీ వేణుగోపాల స్వామి ఆలయము, పేరూరు">
</div>

<section class="carousel" aria-roledescription="carousel" aria-label="ఆలయ చిత్రాలు">
  <div class="frame">
    <div #track class="track" (scroll)="onScroll(track)" tabindex="0">
      @for (s of slides; track s; let i = $index) {
        <img class="slide" [src]="s" [alt]="'ఆలయ చిత్రం ' + (i + 1)"
             [attr.loading]="i < 2 ? 'eager' : 'lazy'" role="group" aria-roledescription="slide">
      }
    </div>

    <span class="count" aria-live="polite">{{ current + 1 }} / {{ slides.length }}</span>

    <button type="button" class="arrow prev pressable" aria-label="మునుపటి" (click)="go(track, current - 1)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <button type="button" class="arrow next pressable" aria-label="తదుపరి" (click)="go(track, current + 1)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </div>

  <div class="dashes" aria-hidden="true">
    @for (s of slides; track s; let i = $index) {
      <span [class.on]="i === current"></span>
    }
  </div>
</section>

<div class="page wide">
  <header class="page-head">
    <h1 class="display">ఫోటోలు</h1>
    <p class="lede">ఆలయ దర్శనం · చిత్రాన్ని నొక్కి పెద్దగా చూడండి</p>
  </header>

  <div class="grid">
    @for (p of photos; track p; let i = $index) {
      <button type="button" class="cell pressable" [attr.aria-label]="'చిత్రం ' + (i + 1) + ' పెద్దగా చూడండి'" (click)="open(i)">
        <img [src]="p" alt="" loading="lazy">
      </button>
    }
  </div>
</div>

<dialog #viewer class="viewer" aria-label="ఫోటోలు" (click)="$event.target === viewer && viewer.close()">
  <button type="button" class="icon-btn close pressable" aria-label="మూసివేయి" (click)="viewer.close()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div #strip class="strip">
    @for (p of photos; track p; let i = $index) {
      <img [src]="p" [alt]="'ఆలయ చిత్రం ' + (i + 1)" loading="lazy">
    }
  </div>
</dialog>
